name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          cmdline-tools-version: 14742923
          packages: ''

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK 37
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.BILISEARCH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing BILISEARCH_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > signing/keystore.p12

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Unit tests and APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/signing/keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.BILISEARCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BILISEARCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BILISEARCH_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliSearchFixer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliSearchFixer-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
